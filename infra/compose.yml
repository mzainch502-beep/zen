services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zen
      POSTGRES_USER: zen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zen"]
      interval: 5s
      retries: 10
  api:
    build: {context: .., dockerfile: infra/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://zen:${POSTGRES_PASSWORD}@postgres:5432/zen
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?set a base64 32-byte key}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      MARKET_EXCHANGE: ${MARKET_EXCHANGE:-bitget}
    ports: ["127.0.0.1:8080:8080"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    build: {context: .., dockerfile: infra/Dockerfile}
    command: ["python", "-m", "backend.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://zen:${POSTGRES_PASSWORD}@postgres:5432/zen
      MARKET_EXCHANGE: ${MARKET_EXCHANGE:-bitget}
    depends_on: {api: {condition: service_healthy}}
    restart: on-failure
volumes:
  pgdata:
